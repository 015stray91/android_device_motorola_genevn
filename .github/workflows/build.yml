name: OrangeFox Recovery Compiler

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04 # Correct environment for Android 12 build tools and Node 24
    steps:
    - name: Checkout Workspace Assets
      uses: actions/checkout@v5 # Upgraded to use Node 24 runtime natively

    - name: Cleanup Runner Storage Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost"

    - name: Execute Android Recovery Compilation
      uses: CaptainThrowback/Action-Recovery-Builder@main
      env:
        MANIFEST: "https://gitlab.com -b 12.1"
        DEVICE: "genevn"
        # Restored the short placeholder so the wrapper handles path generation
        DT_LINK: "https://github.com -b OrangeFox_12.1"
        TARGET: "recoveryimage"
        OUTPUT: "recovery.img"
        # Force KernelSU Next Support and Wipe Out Magisk v25 Menus
        FOX_ENABLE_KERNELSU_NEXT_SUPPORT: "1"
        OF_DISABLE_MAGISK_ADDON: "1"

    - name: Upload Downloadable Recovery Image Artifact
      uses: actions/upload-artifact@v6 # Upgraded to modern v6 for true Node 24 handling
      with:
        name: orangefox-genevn
        path: |
          workspace/out/target/product/genevn/recovery.img
          workspace/out/target/product/genevn/OrangeFox-*.zip
        if-no-files-found: warn
        
